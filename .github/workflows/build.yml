
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FlipBall
        run: unzip -o FlipBall-AndroidStudio-fixed.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK 35
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Project
        run: |
          ls -la FlipBall
          test -f FlipBall/settings.gradle || test -f FlipBall/settings.gradle.kts

      - name: Build FlipBall APK
        working-directory: FlipBall
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlipBall-debug-apk
          path: FlipBall/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
